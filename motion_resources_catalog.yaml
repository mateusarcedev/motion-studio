schema_version: 1
title: MOTION — Catálogo de 25 recursos externos
date: '2026-10-28'
policy:
  source_of_truth: .agents/skills/
  principles:
  - A inclusão neste catálogo não significa instalação ou autorização de redistribuição.
  - Auditar LICENSE, termos de uso, autoria, dependências e segurança antes de copiar ou executar.
  - Preferir Playwright como navegador padrão se já existir no repositório; Puppeteer opcional.
  - Separar renderização e bibliotecas por necessidade; não carregar dependências pesadas globalmente.
  - Consultar 21st.dev por meios permitidos; nunca fazer scraping de marketplace não autorizado.
  - Adaptar composições de formato na origem, e não por crop cego.
  - Manter frame determinístico e seekable; review por stills/contact sheets.
  review_states:
  - candidato_nao_integrado
  - verificado
  - aprovado
  - integrado
  - bloqueado
