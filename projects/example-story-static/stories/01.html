<!doctype html><html lang="pt-BR"><head><meta charset="utf-8">
<style>
:root{--rose:#F38FA8;--blue:#62C8EA;--navy:#173C5B;--cream:#FFF9F6;--gold:#D5A94E}
*{margin:0;box-sizing:border-box}
/* safe-zones do preset story: topo 22% · base 16% · lados 7% */
body{width:1080px;height:1920px;background:var(--navy);color:var(--cream);font-family:Geist,system-ui,sans-serif;overflow:hidden;position:relative}
.deco{position:absolute;width:800px;height:800px;border-radius:50%;background:var(--rose);opacity:.16;bottom:-300px;left:-260px}
.deco2{position:absolute;width:520px;height:520px;border-radius:50%;background:var(--blue);opacity:.14;top:-200px;right:-160px}
.wrap{position:absolute;inset:22% 7% 16% 7%;display:flex;flex-direction:column;justify-content:center;gap:30px}
.k{font-size:32px;letter-spacing:.2em;text-transform:uppercase;color:var(--blue);font-weight:700}
h1{font-family:'Instrument Serif',serif;font-size:128px;line-height:1.06;font-weight:400}
h1 em{font-style:italic;color:var(--rose)}
p{font-size:38px;line-height:1.5;opacity:.88}
.cta{margin-top:16px;background:var(--cream);color:var(--navy);font-size:42px;font-weight:700;padding:30px 56px;border-radius:999px;align-self:center}
</style></head><body>
<div class="deco" data-bleed></div><div class="deco2" data-bleed></div>
<div class="wrap">
<div class="k">Mini Festa da Rose</div>
<h1>Festa <em>pequena</em>,<br>memória grande.</h1>
<p>Decoração à mão, docinhos e o dia todo cuidamos nós — você só convida e aproveita.</p>
<div class="cta">Arrasta ↑ pra reservar</div>
</div></body></html>
