<!doctype html><html lang="pt-BR"><head><meta charset="utf-8">
<style>
:root{--rose:#F38FA8;--blue:#62C8EA;--navy:#173C5B;--cream:#FFF9F6;--gold:#D5A94E}
*{margin:0;box-sizing:border-box}
body{width:1080px;height:1350px;background:var(--rose);font-family:Geist,system-ui,sans-serif;color:var(--navy);overflow:hidden;position:relative}
.blob{position:absolute;width:620px;height:620px;background:var(--blue);opacity:.25;border-radius:50%;top:-200px;left:-180px}
.wrap{position:relative;height:100%;display:flex;flex-direction:column;justify-content:center;align-items:flex-start;padding:96px}
.kicker{font-size:30px;letter-spacing:.24em;text-transform:uppercase;color:var(--cream);font-weight:700;margin-bottom:26px}
h1{font-family:Instrument Serif,serif;font-size:112px;line-height:1.08;font-weight:400;color:var(--cream)}
.cta{margin-top:46px;background:var(--navy);color:var(--cream);font-size:36px;font-weight:700;padding:30px 54px;border-radius:999px}
.hint{margin-top:24px;font-size:26px;opacity:.85;color:var(--navy)}
.page{position:absolute;bottom:56px;left:96px;font-size:26px;letter-spacing:.2em;color:var(--navy);opacity:.6}
</style></head><body>
<div class="blob" data-bleed></div>
<div class="wrap">
  <div class="kicker">Reserve sua data</div>
  <h1>Pequenos detalhes,<br>grandes momentos.</h1>
  <div class="cta">Chama no WhatsApp 💬</div>
  <p class="hint">mini festa da rose · agenda de novembro aberta</p>
</div>
<div class="page">03 / 03</div>
</body></html>
