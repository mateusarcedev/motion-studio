<!doctype html><html lang="pt-BR"><head><meta charset="utf-8">
<style>
:root{
  --rose:#F38FA8; --blue:#62C8EA; --navy:#173C5B; --cream:#FFF9F6; --gold:#D5A94E;
}
*{margin:0;box-sizing:border-box}
body{width:1080px;height:1350px;background:var(--cream);font-family:Geist,system-ui,sans-serif;color:var(--navy);overflow:hidden;position:relative}
.deco{position:absolute;border-radius:50%}
.d1{width:520px;height:520px;background:var(--rose);opacity:.16;top:-180px;right:-140px}
.d2{width:260px;height:260px;background:var(--blue);opacity:.22;bottom:-90px;left:-80px}
.wrap{position:relative;height:100%;display:flex;flex-direction:column;justify-content:center;padding:96px;text-align:left}
.kicker{font-size:30px;letter-spacing:.24em;text-transform:uppercase;color:var(--rose);font-weight:700;margin-bottom:28px}
h1{font-family:Instrument Serif,serif;font-size:118px;line-height:1.06;font-weight:400}
h1 em{font-style:italic;color:var(--rose)}
.sub{margin-top:36px;font-size:36px;line-height:1.4;color:var(--navy);opacity:.85;max-width:820px}
.dot{width:56px;height:6px;background:var(--gold);border-radius:3px;margin-top:48px}
.page{position:absolute;bottom:56px;left:96px;font-size:26px;letter-spacing:.2em;color:var(--navy);opacity:.5}
</style></head><body>
<div class="deco d1" data-bleed></div><div class="deco d2" data-bleed></div>
<div class="wrap">
  <div class="kicker">Pequenos detalhes, momentos grandes</div>
  <h1>Sua festa,<br>do jeitinho<br>que você <em>sonhou</em>.</h1>
  <p class="sub">A Mini Festa da Rose cuida de cada detalhe para transformar a celebração da sua família em lembranças especiais.</p>
  <div class="dot"></div>
</div>
<div class="page">01 / 03</div>
</body></html>
