<!doctype html><html lang="pt-BR"><head><meta charset="utf-8">
<style>
:root{--rose:#F38FA8;--blue:#62C8EA;--navy:#173C5B;--cream:#FFF9F6;--gold:#D5A94E}
*{margin:0;box-sizing:border-box}
body{width:1080px;height:1350px;background:var(--navy);font-family:Geist,system-ui,sans-serif;color:var(--cream);overflow:hidden;position:relative}
.card{position:relative;height:100%;display:flex;flex-direction:column;justify-content:center;padding:96px;gap:34px}
.kicker{font-size:30px;letter-spacing:.24em;text-transform:uppercase;color:var(--blue);font-weight:700}
.item{background:rgba(255,249,246,.06);border:1px solid rgba(98,200,234,.35);border-radius:24px;padding:38px 44px}
.item h3{font-family:Instrument Serif,serif;font-size:46px;font-weight:400;color:var(--cream)}
.item p{font-size:30px;line-height:1.45;opacity:.85;margin-top:10px}
.gold{width:56px;height:6px;background:var(--gold);border-radius:3px}
.page{position:absolute;bottom:56px;left:96px;font-size:26px;letter-spacing:.2em;opacity:.5}
</style></head><body>
<div class="card">
  <div class="kicker">Como funciona</div>
  <div class="item"><h3>1 · Conta o sonho</h3><p>Você nos conta o momento que quer celebrar e quantas pessoas vêm.</p></div>
  <div class="item"><h3>2 · Planeja com a Rose</h3><p>Decoração, docinhos e cada detalhe são pensados à mão para a sua família.</p></div>
  <div class="item"><h3>3 · Acontece</h3><p>No dia, você só vive o momento — nós cuidamos do resto.</p></div>
  <div class="gold"></div>
</div>
<div class="page">02 / 03</div>
</body></html>
