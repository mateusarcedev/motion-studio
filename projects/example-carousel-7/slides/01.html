<!doctype html><html lang="pt-BR"><head><meta charset="utf-8">
<style>
:root{--rose:#F38FA8;--blue:#62C8EA;--navy:#173C5B;--cream:#FFF9F6;--gold:#D5A94E}
*{margin:0;box-sizing:border-box}
body{width:1080px;height:1350px;background:var(--cream);color:var(--navy);font-family:Geist,system-ui,sans-serif;overflow:hidden;position:relative}
.deco{position:absolute;border-radius:50%}
.d1{width:560px;height:560px;background:var(--rose);opacity:.16;top:-190px;right:-150px}
.d2{width:280px;height:280px;background:var(--blue);opacity:.22;bottom:-100px;left:-90px}
.wrap{position:relative;height:100%;display:flex;flex-direction:column;justify-content:center;padding:96px}
.kicker{font-size:30px;letter-spacing:.2em;text-transform:uppercase;color:var(--rose);font-weight:700;margin-bottom:26px}
h1{font-family:'Instrument Serif',serif;font-size:116px;line-height:1.06;font-weight:400}
h1 em{font-style:italic;color:var(--rose)}
.sub{margin-top:34px;font-size:36px;line-height:1.4;opacity:.85;max-width:840px}
.page{position:absolute;bottom:56px;left:96px;font-size:26px;letter-spacing:.2em;opacity:.5}
</style></head><body>
<div class="deco d1" data-bleed></div><div class="deco d2" data-bleed></div>
<div class="wrap">
  <div class="kicker">Pequenos detalhes, momentos grandes</div>
  <h1>Sua festa,<br>do jeitinho<br>que você <em>sonhou.</em></h1>
  <p class="sub">Existem festas que parecem pequenas no plano e gigantes na memória. É assim que a Rose cuida de cada detalhe.</p>
</div>
<div class="page">01 / 07</div>
</body></html>
