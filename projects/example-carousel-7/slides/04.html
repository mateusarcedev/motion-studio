<!doctype html><html lang="pt-BR"><head><meta charset="utf-8">
<style>
:root{--rose:#F38FA8;--blue:#62C8EA;--navy:#173C5B;--cream:#FFF9F6;--gold:#D5A94E}
*{margin:0;box-sizing:border-box}
body{width:1080px;height:1350px;background:var(--navy);color:var(--cream);font-family:Geist,system-ui,sans-serif;overflow:hidden;position:relative}
.card{position:relative;height:100%;display:flex;flex-direction:column;justify-content:center;padding:96px;gap:30px}
.kicker{font-size:30px;letter-spacing:.2em;text-transform:uppercase;color:var(--blue);font-weight:700}
.n{font-family:'Instrument Serif',serif;font-size:150px;line-height:1;color:var(--gold)}
h2{font-family:'Instrument Serif',serif;font-size:74px;font-weight:400}
p{font-size:34px;line-height:1.45;opacity:.85;max-width:820px}
.bar{width:64px;height:6px;background:var(--rose);border-radius:3px}
.page{position:absolute;bottom:56px;left:96px;font-size:26px;letter-spacing:.2em;opacity:.5}
</style></head><body><div class="card">
<div class="kicker">Como funciona · 3 de 3</div>
<div class="n">3</div>
<h2>Acontece</h2>
<p>No dia, você só vive o momento com quem você ama — nós cuidamos do resto.</p>
<div class="bar"></div>
<div class="page">04 / 07</div>
</div></body></html>
