<!doctype html><html lang="pt-BR"><head><meta charset="utf-8">
<style>
:root{--rose:#F38FA8;--blue:#62C8EA;--navy:#173C5B;--cream:#FFF9F6;--gold:#D5A94E}
*{margin:0;box-sizing:border-box}
body{width:1080px;height:1350px;background:var(--rose);color:var(--navy);font-family:Geist,system-ui,sans-serif;overflow:hidden;position:relative}
.blob{position:absolute;width:640px;height:640px;border-radius:50%;background:var(--blue);opacity:.25;top:-210px;left:-190px}
.wrap{position:relative;height:100%;display:flex;flex-direction:column;justify-content:center;align-items:flex-start;padding:96px}
.k{font-size:30px;letter-spacing:.2em;text-transform:uppercase;color:var(--cream);font-weight:700;margin-bottom:24px}
h2{font-family:'Instrument Serif',serif;font-size:118px;line-height:1.07;font-weight:400;color:var(--cream)}
.cta{margin-top:44px;background:var(--navy);color:var(--cream);font-size:38px;font-weight:700;padding:32px 56px;border-radius:999px}
.hint{margin-top:22px;font-size:27px;opacity:.85}
.page{position:absolute;bottom:56px;left:96px;font-size:26px;letter-spacing:.2em;color:var(--navy);opacity:.6}
</style></head><body>
<div class="blob" data-bleed></div>
<div class="wrap">
<div class="k">Reserve sua data</div>
<h2>Pequenos detalhes,<br>grandes momentos.</h2>
<div class="cta">Chama no WhatsApp 💬</div>
<p class="hint">Mini Festa da Rose · agenda de novembro aberta</p>
</div>
<div class="page">07 / 07</div>
</body></html>
