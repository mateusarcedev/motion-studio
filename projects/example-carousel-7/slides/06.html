<!doctype html><html lang="pt-BR"><head><meta charset="utf-8">
<style>
:root{--rose:#F38FA8;--blue:#62C8EA;--navy:#173C5B;--cream:#FFF9F6;--gold:#D5A94E}
*{margin:0;box-sizing:border-box}
body{width:1080px;height:1350px;background:var(--navy);color:var(--cream);font-family:Geist,system-ui,sans-serif;overflow:hidden;position:relative}
.deco{position:absolute;width:420px;height:420px;border-radius:50%;background:var(--rose);opacity:.14;top:-160px;left:-120px}
.wrap{position:relative;height:100%;display:flex;flex-direction:column;justify-content:center;padding:96px;gap:36px}
.k{font-size:30px;letter-spacing:.2em;text-transform:uppercase;color:var(--blue);font-weight:700}
.q,.q *{font-family:'Instrument Serif',serif;font-size:82px;line-height:1.15;display:block}
.who{font-size:30px;opacity:.7}
.stars{color:var(--gold);font-size:40px;letter-spacing:6px}
.page{position:absolute;bottom:56px;left:96px;font-size:26px;letter-spacing:.2em;opacity:.5}
</style></head><body>
<div class="deco" data-bleed></div>
<div class="wrap">
<div class="k">Quem já celebrou</div>
<div class="q"><span>A única coisa que precisei fazer foi escolher a data. O resto caiu do céu.</span></div>
<div class="who">Mariana, aniversário da Alice (4 anos)</div>
<div class="stars">★ ★ ★ ★ ★</div>
<div class="page">06 / 07</div>
</div></body></html>
