<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><style>
:root{--rose:#F38FA8;--blue:#62C8EA;--navy:#173C5B;--cream:#FFF9F6;--gold:#D5A94E}
*{margin:0;box-sizing:border-box}
body{color:var(--navy);font-family:Geist,system-ui,sans-serif;overflow:hidden;position:relative}
.serif{font-family:"Instrument Serif",serif;font-weight:400}
.k{font-weight:700;letter-spacing:.2em;text-transform:uppercase;color:var(--rose)}
.bar{background:var(--gold);border-radius:3px}
.deco{position:absolute;border-radius:50%}
</style>
<style>body{width:1080px;height:1350px;background:var(--cream)}
.k{font-size:26px}
.wrap{position:relative;height:100%;display:flex;flex-direction:column;justify-content:center;padding:96px;gap:24px}
.deco{width:520px;height:520px;background:var(--rose);opacity:.16;top:-190px;right:-150px}
h1{font-family:'Instrument Serif',serif;font-size:126px;line-height:1.05}
h1 em{font-style:italic;color:var(--rose)}
p{font-size:34px;line-height:1.45;opacity:.85;max-width:820px}
.cta{margin-top:12px;background:var(--navy);color:var(--cream);font-size:30px;font-weight:700;padding:24px 46px;border-radius:999px;align-self:flex-start}
</style></head><body><div class="wrap">
<div class="deco" data-bleed></div>
<div class="k">Pequenos detalhes, momentos grandes</div>
<h1>Um <em>dia</em> que fica na memória.</h1>
<p>Festas pequenas com decoração feita à mão e o cuidado que a festa merece.</p>
<div class="cta">Reserve · WhatsApp</div>
</div></body></html>
