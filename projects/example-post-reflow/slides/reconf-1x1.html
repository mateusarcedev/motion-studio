<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><style>
:root{--rose:#F38FA8;--blue:#62C8EA;--navy:#173C5B;--cream:#FFF9F6;--gold:#D5A94E}
*{margin:0;box-sizing:border-box}
body{color:var(--navy);font-family:Geist,system-ui,sans-serif;overflow:hidden;position:relative}
.serif{font-family:"Instrument Serif",serif;font-weight:400}
.k{font-weight:700;letter-spacing:.2em;text-transform:uppercase;color:var(--rose)}
.bar{background:var(--gold);border-radius:3px}
.deco{position:absolute;border-radius:50%}
</style>
<style>body{width:1080px;height:1080px;background:var(--cream);display:flex;align-items:center;justify-content:center;text-align:center}
.k{font-size:24px}
.wrap{position:relative;width:100%;height:100%;padding:80px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:26px}
h1{font-family:'Instrument Serif',serif;font-size:120px;line-height:1.06}
h1 em{font-style:italic;color:var(--rose)}
.d1{width:420px;height:420px;background:var(--blue);opacity:.18;top:-170px;left:-140px}
.d2{width:300px;height:300px;background:var(--rose);opacity:.28;bottom:-120px;right:-110px}
p{font-size:32px;line-height:1.5;opacity:.85;max-width:760px}
.cta{background:var(--navy);color:var(--cream);font-size:28px;font-weight:700;padding:22px 44px;border-radius:999px}
</style></head><body><div class="wrap">
<div class="deco d1" data-bleed></div><div class="deco d2" data-bleed></div>
<div class="k">Pequenos detalhes, momentos grandes</div>
<h1>Um <em>dia</em> que fica<br>na memória.</h1>
<p>Festas pequenas, decoração à mão, docinhos selecionados — tudo aprovado por você antes do grande dia.</p>
<div class="cta">Reserve · WhatsApp</div>
</div></body></html>
