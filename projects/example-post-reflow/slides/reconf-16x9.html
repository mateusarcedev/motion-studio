<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><style>
:root{--rose:#F38FA8;--blue:#62C8EA;--navy:#173C5B;--cream:#FFF9F6;--gold:#D5A94E}
*{margin:0;box-sizing:border-box}
body{color:var(--navy);font-family:Geist,system-ui,sans-serif;overflow:hidden;position:relative}
.serif{font-family:"Instrument Serif",serif;font-weight:400}
.k{font-weight:700;letter-spacing:.2em;text-transform:uppercase;color:var(--rose)}
.bar{background:var(--gold);border-radius:3px}
.deco{position:absolute;border-radius:50%}
</style>
<style>body{width:1920px;height:1080px;background:var(--cream)}
.k{font-size:26px}
.split{position:relative;height:100%;display:grid;grid-template-columns:1.15fr 1fr}
.left{padding:90px;display:flex;flex-direction:column;justify-content:center;gap:26px}
h1{font-family:'Instrument Serif',serif;font-size:130px;line-height:1.03}
h1 em{font-style:italic;color:var(--rose)}
.right{background:var(--navy);color:var(--cream);display:flex;flex-direction:column;justify-content:center;gap:20px;padding:90px;position:relative}
.deco{width:360px;height:360px;background:var(--rose);opacity:.18;top:-140px;right:-120px}
.pack{font-family:'Instrument Serif',serif;font-size:56px}
.items{font-size:30px;line-height:2;opacity:.9}
.cta{align-self:start;background:var(--rose);color:var(--navy);font-size:28px;font-weight:700;padding:20px 40px;border-radius:999px}
</style></head><body>
<div class="split">
<div class="left"><div class="k">Pequenos detalhes, momentos grandes</div>
<h1>Um <em>dia</em> que fica na memória.</h1>
<p style="font-size:32px;max-width:640px;opacity:.85;line-height:1.45">Festas pequenas com decoração feita à mão e o cuidado que a festa merece.</p></div>
<div class="right"><div class="deco" data-bleed></div>
<div class="pack">Pacote Novo</div>
<div class="items">✓ decoração à mão<br>✓ docinhos selecionados<br>✓ mesa do brigadeiro</div>
<div class="cta">Reserve · WhatsApp</div></div>
</div></body></html>
