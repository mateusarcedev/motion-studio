<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Máquinas de Estados em Programação — Aula Interativa</title>
  <style>
/* Guided lesson shell. Replace the tokens per subject; keep the hierarchy:
   progress → title → scene → one narration line + one primary action. */
:root {
  --font:'Inter',ui-sans-serif,system-ui,-apple-system,'Segoe UI',sans-serif;
  --mono:ui-monospace,'SF Mono',Menlo,Consolas,monospace;
  --bg:#f6f5f1;
  --surface:#fff;
  --ink:#14161b;
  --muted:#6b6f78;
  --faint:#a3a6ad;
  --line:#e6e3dc;
  --accent:#3b5bdb;
  --accent-soft:#e9edff;
  --accent-ink:#2a44b8;
  --warm:#f59f00;
  --warm-soft:#fff3d6;
  --good:#0c8a5f;
  --good-soft:#e3f6ee;
  --bad:#d9480f;
  --bad-soft:#fdebe2;
  --radius:20px;
  font-family:var(--font);
  color:var(--ink);
  background:var(--bg);
  font-feature-settings:'cv11','ss01';
  -webkit-font-smoothing:antialiased
}
* { box-sizing:border-box }
html,body { margin:0; height:100% }
body { background:var(--bg) }
button,input,select,textarea { font:inherit; color:inherit }
button { cursor:pointer }
button:disabled { cursor:default }
:focus-visible { outline:3px solid var(--accent); outline-offset:3px; border-radius:8px }

.lp { display:grid; grid-template-columns:minmax(0,1fr); grid-template-rows:auto minmax(0,1fr) auto; height:100dvh; max-width:1360px; margin:0 auto; padding:0 clamp(16px,3vw,44px) }
.lp-top { display:flex; align-items:center; gap:24px; height:64px }
.lp-course { margin:0; font-size:14px; font-weight:600; color:var(--muted); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:30%}
.lp-progress { flex:1; display:flex; gap:4px }
.lp-progress button { flex:1; background:none; border:0; padding:12px 0 }
.lp-progress span { display:block; height:5px; border-radius:99px; background:var(--line) }
.lp-progress .done span { background:color-mix(in srgb,var(--accent) 45%,var(--line)) }
.lp-progress [aria-current] span { background:var(--accent) }
.lp-progress button:hover span { background:var(--faint) }

.lp-stage { display:flex; flex-direction:column; min-height:0; padding-top:6px }
.lp-kicker { margin:0; font-size:13px; font-weight:650; letter-spacing:.12em; text-transform:uppercase; color:var(--accent) }
.lp-stage h1 { margin:6px 0 0; font-size:clamp(28px,3vw,42px); line-height:1.08; font-weight:720; letter-spacing:-.025em; max-width:30ch; text-wrap:balance }
.lp-scene { position:relative; flex:1; min-height:0; margin:18px 0 12px; background:var(--surface); border-radius:var(--radius); box-shadow:0 1px 2px rgba(20,22,27,.04),0 12px 40px rgba(20,22,27,.06); overflow:hidden; display:flex }
.lp-scene > * { flex:1; min-width:0 }
.lp-inputs { display:flex; flex-wrap:wrap; align-items:center; gap:10px 14px; margin:0 0 6px }
.lp-inputs[hidden] { display:none }
.lp-label { font-size:15px; font-weight:600; color:var(--muted) }
.lp-value { font:600 18px var(--mono); min-width:4ch; color:var(--ink) }
.lp-inputs input[type=range] { width:min(320px,60vw); accent-color:var(--accent) }
.lp-inputs select { padding:10px 12px; border:1.5px solid var(--line); border-radius:12px; background:var(--surface) }
.lp-choices { display:flex; flex-wrap:wrap; align-items:center; gap:10px }
.lp-choice { padding:11px 18px; border:1.5px solid var(--line); border-radius:14px; background:var(--surface); font-size:17px; font-weight:550 }
.lp-choice:hover { border-color:var(--faint) }
.lp-choice[aria-pressed=true] { border-color:var(--accent); background:var(--accent-soft); color:var(--accent-ink) }

.lp-bar { display:grid; grid-template-columns:auto minmax(0,1fr) auto auto; align-items:center; gap:18px; padding:12px 0 18px; border-top:1px solid var(--line) }
.lp-narration p { margin:0; min-height:2.8em; display:flex; align-items:center; font-size:clamp(17px,1.45vw,21px); line-height:1.4; font-weight:520; text-wrap:pretty }
.lp-dots { display:flex; gap:6px; margin-top:4px; height:6px }
.lp-dots i { width:6px; height:6px; border-radius:99px; background:var(--line) }
.lp-dots .done { background:color-mix(in srgb,var(--accent) 45%,var(--line)) }
.lp-dots .now { width:20px; background:var(--accent) }
.lp-go { display:flex; flex-direction:column; align-items:center; gap:4px }
.lp-primary { min-width:170px; padding:15px 28px; border:0; border-radius:999px; background:var(--ink); color:#fff; font-size:17px; font-weight:650; box-shadow:0 6px 18px rgba(20,22,27,.18) }
/* No CSS transitions on anything the timeline or the capture touches: they would run outside seek. */
.lp-primary:hover:not(:disabled) { background:#000; transform:translateY(-1px) }
.lp-primary:disabled { background:var(--faint); box-shadow:none }
.lp-keys { font-size:12px; color:var(--faint) }
.lp-ghost { background:none; border:0; border-radius:10px; padding:10px 14px; font-size:15px; font-weight:550; color:var(--muted) }
.lp-ghost:hover:not(:disabled) { background:color-mix(in srgb,var(--line) 70%,transparent); color:var(--ink) }
.lp-ghost:disabled { opacity:.35 }
.lp-replay { font-size:22px; padding:6px 12px }
.lp-replay[hidden] { display:block; visibility:hidden }

.lp-drawer { position:fixed; inset:0 0 0 auto; width:min(440px,92vw); background:var(--surface); box-shadow:-20px 0 60px rgba(20,22,27,.15); padding:24px 28px; overflow:auto; z-index:10; font-size:15px; line-height:1.55 }
.lp-drawer[hidden] { display:none }
.lp-drawer-head { display:flex; justify-content:space-between; align-items:center }
.lp-drawer h2 { margin:0; font-size:20px }
.lp-drawer h3 { margin:22px 0 6px; font-size:13px; letter-spacing:.08em; text-transform:uppercase; color:var(--muted) }
.lp-drawer ul { margin:0; padding-left:18px }
.lp-drawer li { margin:8px 0 }
.lp-drawer a { color:var(--accent-ink) }
.lp-drawer p { margin:2px 0 0; color:var(--muted) }

/* Scene building blocks. A scene uses one of them; text inside stays short. */
.sc-split { display:grid; grid-template-columns:minmax(0,5fr) minmax(0,7fr); gap:clamp(20px,3vw,48px); align-items:center; padding:clamp(20px,3vw,44px) }
.sc-center { display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; gap:18px; padding:clamp(20px,3vw,44px) }
.sc-full { display:flex; padding:clamp(12px,2vw,28px) }
.sc-full > svg, .sc-visual > svg { width:100%; height:100%; display:block }
.sc-visual { min-height:0; height:100%; display:flex; align-items:center }
.sc-say { margin:0; font-size:clamp(24px,2.3vw,34px); line-height:1.22; font-weight:650; letter-spacing:-.015em; text-wrap:balance }
.sc-sub { margin:14px 0 0; font-size:clamp(16px,1.3vw,19px); line-height:1.5; color:var(--muted); text-wrap:pretty }
/* Deeper explanation: body style, comfortable measure, same place on every screen that has one. */
.sc-read { margin:16px 0 0; font-size:clamp(16px,1.25vw,18px); line-height:1.65; color:var(--ink); max-width:62ch; text-wrap:pretty }
.sc-term { display:inline-block; padding:2px 10px; border-radius:8px; background:var(--accent-soft); color:var(--accent-ink); font-weight:650 }
.sc-big { font-size:clamp(56px,7vw,112px); line-height:1; font-weight:760; letter-spacing:-.04em; font-variant-numeric:tabular-nums }
.sc-label { font-size:14px; font-weight:600; letter-spacing:.06em; text-transform:uppercase; color:var(--muted) }
.sc-note { font-size:13px; color:var(--faint) }
.sc-feedback { margin:18px 0 0; padding:16px 18px; border-radius:14px; font-size:18px; line-height:1.5; background:var(--good-soft); color:#075c3f }
.sc-feedback.wrong { background:var(--bad-soft); color:#9a330a }
.lp svg text { font-family:var(--font) }
.sc-only-narrow { display:none!important }

/* Practice: the question and its answer cards form one group in the middle of the screen. */
.lp[data-kind=pratica] .lp-stage { justify-content:center }
.lp[data-kind=pratica] .lp-scene { flex:0 1 auto; min-height:260px }
.lp[data-kind=pratica] .lp-inputs { justify-content:center; margin:6px 0 24px }
.lp[data-kind=pratica] .lp-inputs .lp-label { display:none }
.lp[data-kind=pratica] .lp-choice { padding:16px 26px; font-size:19px }

/* kit.js blocks */
.sc-copy { max-width:44ch }
.sc-question { max-width:780px }
.sc-question .sc-say { font-size:clamp(26px,2.4vw,34px) }
.sc-cards { flex:1; display:grid; grid-template-columns:repeat(auto-fit,minmax(220px,1fr)); gap:22px; padding:clamp(20px,3vw,44px); align-content:center }
.sc-card { padding:28px; border-radius:18px; background:var(--bg) }
.sc-card b { display:block; font-size:44px; margin-bottom:12px }
.sc-card p { margin:0; font-size:21px; line-height:1.35; font-weight:620 }
.sc-card span { display:block; margin-top:10px; font-size:16px; color:var(--muted) }
.mock-app { width:min(clamp(380px,40vw,600px),100%); font-size:clamp(16px,1.3vw,19px); border-radius:28px; background:var(--surface); border:1px solid var(--line); box-shadow:0 24px 60px rgba(20,22,27,.16); overflow:hidden; text-align:left }
.mock-app-bar { display:flex; align-items:center; justify-content:space-between; padding:18px 22px; border-bottom:1px solid var(--line); font-size:16px }
.mock-app-bar em { font-style:normal; font-size:12px; font-weight:600; color:var(--muted); padding:2px 8px; border-radius:6px; background:var(--bg) }
.mock-app-body { padding:20px 22px 24px; display:flex; flex-direction:column; gap:14px }
.app-row { display:flex; justify-content:space-between; align-items:center; padding:clamp(14px,1.4vw,20px) 18px; border-radius:14px; background:var(--bg); font-size:inherit }
.app-row b { font:650 1.2em var(--font); font-variant-numeric:tabular-nums }
.app-row.on { background:var(--accent-soft); color:var(--accent-ink) }
.app-hero { padding:6px 4px 10px }
.app-hero span { display:block; color:var(--muted) }
.app-hero b { display:block; margin-top:6px; font-size:2.4em; font-weight:720; letter-spacing:-.02em; font-variant-numeric:tabular-nums }
.app-btn { padding:14px; border-radius:14px; background:var(--accent); color:#fff; text-align:center; font-weight:650 }
.app-toast { padding:12px 14px; border-radius:12px; background:var(--good-soft); color:#075c3f; font-weight:600 }

/* Realistic mock of a tool. Label it as a simulation inside the scene. */
/* A mock fills the scene: it is the evidence the screen is about, not a thumbnail. */
.mock { width:100%; max-width:1040px; border-radius:16px; overflow:hidden; background:#16181d; color:#e8e9ec; box-shadow:0 20px 50px rgba(20,22,27,.25); font:clamp(15px,1.35vw,20px)/1.6 var(--mono); text-align:left }
.mock-bar { display:flex; align-items:center; gap:8px; padding:12px 16px; background:#202329; font:600 13px var(--font); color:#9aa0aa }
.mock-bar i { width:12px; height:12px; border-radius:99px; background:#3a3e46 }
.mock-bar span { margin-left:10px }
.mock-bar em { margin-left:auto; font-style:normal; font-weight:500; padding:2px 8px; border-radius:6px; background:#2c3038 }
.mock pre { margin:0; padding:22px 26px; min-height:clamp(220px,38vh,420px); white-space:pre-wrap; font:inherit }
.mock .p { color:#7c8494 }
.mock .k { color:#8fb4ff }
.mock .s { color:#ffd479 }
.mock .ok { color:#5ee0a5 }
.mock .warn { color:#ff9f6e }
.mock .hl { background:rgba(255,212,121,.16); border-radius:4px; box-shadow:0 0 0 3px rgba(255,212,121,.16) }
.mock .cursor { display:inline-block; width:.6em; height:1.1em; vertical-align:-.15em; background:#e8e9ec }

@media (max-width:760px), (max-height:640px) {
  .lp { height:auto; min-height:100dvh; grid-template-rows:auto auto auto }
  .lp-course { display:none }
  .lp-scene { min-height:340px }
  .lp-bar { grid-template-columns:auto 1fr auto }
  .lp-narration { grid-column:1/-1; order:-1 }
  .lp-keys { display:none }
  .lp-primary { min-width:0 }
  .sc-split { grid-template-columns:1fr }
  .sc-only-wide { display:none!important }
  .sc-only-narrow { display:block!important }
  .sc-wide { overflow-x:auto }
  .sc-wide > svg { width:760px!important; height:auto!important; flex:none }
  .mock { font-size:13px }
}
@media (prefers-reduced-motion:reduce) { * { transition:none!important; scroll-behavior:auto!important } }


/* Custom visual styles for state machine diagram and mock */
:root {
  --accent: #10B981;
  --accent-soft: rgba(16, 185, 129, 0.12);
  --accent-ink: #065F46;
  --good: #10B981;
  --good-soft: rgba(16, 185, 129, 0.12);
  --bad: #EF4444;
  --bad-soft: rgba(239, 68, 68, 0.12);
  --warm: #F59E0B;
  --warm-soft: rgba(245, 158, 11, 0.12);
}

.sc-visual > .sc-full { flex:1; height:100%; min-width:0; padding:0; }
svg text { user-select:none; }
  </style>
</head>
<body>
  <div id="lesson"></div>

  <script>
/* Pure motion helpers. No clocks, timers, DOM reads or hidden random state. */
(function (global) {
  'use strict';
  const clamp = (v, a = 0, b = 1) => Math.max(a, Math.min(b, v));
  const linear = x => clamp(x);
  const easeInOutCubic = x => (x = clamp(x)) < .5 ? 4 * x ** 3 : 1 - (-2 * x + 2) ** 3 / 2;
  const easeOutCubic = x => 1 - (1 - clamp(x)) ** 3;
  const lerp = (a, b, p) => a + (b - a) * p;
  function segment(t, start, end, easing = linear) {
    if (end <= start) return t >= end ? 1 : 0;
    return easing(clamp((t - start) / (end - start)));
  }
  function cubic(a, b, c, d, p) {
    const u = 1 - clamp(p); p = clamp(p);
    return {
      x: u ** 3 * a.x + 3 * u ** 2 * p * b.x + 3 * u * p ** 2 * c.x + p ** 3 * d.x,
      y: u ** 3 * a.y + 3 * u ** 2 * p * b.y + 3 * u * p ** 2 * c.y + p ** 3 * d.y
    };
  }
  function contain(source, destination) {
    if (source.w <= 0 || source.h <= 0) throw new Error('Source must have positive dimensions');
    const scale = Math.min(destination.w / source.w, destination.h / source.h);
    return {
      scale,
      x: destination.x + (destination.w - source.w * scale) / 2 - source.x * scale,
      y: destination.y + (destination.h - source.h * scale) / 2 - source.y * scale
    };
  }
  function seeded(seed, index) {
    let x = ((seed | 0) ^ Math.imul((index | 0) + 1, 0x9e3779b1)) >>> 0;
    x ^= x >>> 16; x = Math.imul(x, 0x85ebca6b) >>> 0;
    x ^= x >>> 13; x = Math.imul(x, 0xc2b2ae35) >>> 0;
    return ((x ^ (x >>> 16)) >>> 0) / 4294967296;
  }
  const easeOutQuint = x => 1 - (1 - clamp(x)) ** 5;
  const easeInOutQuart = x => (x = clamp(x)) < .5 ? 8 * x ** 4 : 1 - (-2 * x + 2) ** 4 / 2;
  // Damped spring from 0 to 1, evaluated analytically so any seek gives the same frame.
  // Overshoot stays small (~4%): use for emphasis only, never for quantities with limits.
  function spring(x, { damping = .72, frequency = 2.2 } = {}) {
    x = clamp(x); if (x >= 1) return 1;
    const w = 2 * Math.PI * frequency, d = Math.sqrt(1 - damping ** 2);
    return 1 - Math.exp(-damping * w * x) * (Math.cos(w * d * x) + damping / d * Math.sin(w * d * x));
  }
  // Text and objects enter by fading and rising a few pixels; nothing slides across the screen.
  function enter(t, start, length = .55, rise = 14) {
    const p = easeOutCubic(segment(t, start, start + length));
    return { opacity: p, y: (1 - p) * rise, p, style: `opacity:${p.toFixed(3)};transform:translateY(${((1 - p) * rise).toFixed(2)}px)` };
  }
  // i-th item of a group: start + i * gap.
  const stagger = (t, i, start, gap = .08, length = .5, easing = easeOutCubic) => segment(t, start + i * gap, start + i * gap + length, easing);
  // 0 → 1 → 0 bump, e.g. a highlight that pulses once when something arrives.
  const pulse = (t, at, length = .6) => Math.sin(Math.PI * segment(t, at, at + length));
  // Interpolated SVG viewBox: a camera that frames the part being explained.
  function camera(a, b, p) { return [a.x, a.y, a.w, a.h].map((v, i) => lerp(v, [b.x, b.y, b.w, b.h][i], p).toFixed(2)).join(' '); }
  // Characters typed at a constant rate; the frame depends only on t.
  const typed = (text, t, start, cps = 28) => text.slice(0, Math.max(0, Math.floor((t - start) * cps)));
  function escape(value) {
    return String(value ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]);
  }
  function number(value, { locale = 'pt-BR', digits = 1 } = {}) {
    return new Intl.NumberFormat(locale, { maximumFractionDigits: digits }).format(value);
  }
  global.LessonMotion = Object.freeze({ clamp, linear, easeInOutCubic, easeOutCubic, easeOutQuint, easeInOutQuart, spring, enter, stagger, pulse, camera, typed, lerp, segment, cubic, contain, seeded, escape, number });
})(window);

  </script>

  <script>
/* Scene kit: building blocks for the screen kinds of a guided lesson.
   Every function is pure: same state and time → same markup. Requires motion.js. */
(function (global) {
  'use strict';
  const M = global.LessonMotion, esc = M.escape;
  const op = v => `opacity="${M.clamp(v).toFixed(3)}"`;
  // SVG attributes for an element entering with fade + small rise (see M.enter).
  const rise = e => `opacity="${e.opacity.toFixed(3)}" transform="translate(0 ${e.y.toFixed(2)})"`;

  // Full-width drawing. Size w×h to the content itself, with no empty margins: the drawing then
  // fills the scene on desktop and stays readable when it shrinks to a phone width.
  // `view` lets a camera frame part of the drawing; mark it so the checker knows clipping is
  // intended and only data-qa-focal must stay in frame. `scroll` is a last resort for drawings
  // that cannot be recomposed: a phone then pans a 760 px wide copy.
  // `narrow: { body, w, h }` is a recomposed version (e.g. stacked vertically) shown only on phones;
  // render both from the same state: CSS picks one, so render stays independent of the viewport.
  function diagram(body, { w = 1200, h = 560, view, camera = false, scroll = false, defs = '', narrow = null } = {}) {
    const one = (b, box, cls) => `<svg class="${cls}" viewBox="${box}" preserveAspectRatio="xMidYMid meet" role="img" ${camera ? 'data-qa-camera="câmera segue o foco"' : ''}>${defs}${b}</svg>`;
    const wide = one(body, view || `0 0 ${w} ${h}`, narrow ? 'sc-only-wide' : '');
    const tall = narrow ? one(narrow.body, narrow.view || `0 0 ${narrow.w} ${narrow.h}`, 'sc-only-narrow') : '';
    return `<div class="sc-full ${scroll ? 'sc-wide" data-qa-scroll="diagrama rola no celular' : ''}">${wide}${tall}</div>`;
  }
  // Copy on the left, visual on the right: the screen's single text region. `say` is the idea in one sentence;
  // `sub` a short complement; `read` an optional deeper explanation (up to ~5 lines) in the body style.
  function split({ say, sub = '', read = '', visual, kicker = '' }) {
    return `<div class="sc-split"><div class="sc-copy">${kicker ? `<p class="sc-label">${kicker}</p>` : ''}<p class="sc-say" data-qa-text="say">${say}</p>${sub ? `<p class="sc-sub" data-qa-text="sub">${sub}</p>` : ''}${read ? `<p class="sc-read" data-qa-text="read">${read}</p>` : ''}</div><div class="sc-visual">${visual}</div></div>`;
  }
  // One big statement or number in the middle of the screen.
  function hero({ big = '', say = '', sub = '', style = '' }) {
    return `<div class="sc-center" style="${style}">${big ? `<p class="sc-big" data-qa-text="big">${big}</p>` : ''}${say ? `<p class="sc-say" data-qa-text="say">${say}</p>` : ''}${sub ? `<p class="sc-sub" data-qa-text="sub">${sub}</p>` : ''}</div>`;
  }

  // Terminal mock. `script[k]` holds the lines shown during step k: earlier steps appear complete,
  // later steps are absent. A line is typed ({type:true,text,at,cps}) or shown ({text,at,cls,hl}).
  // A highlight (hl) belongs to its own step only, so one thing is lit at a time; `keep: true` keeps it.
  function terminal(state, time, script, { title = 'terminal', prompt = '$ ', badge = 'simulação' } = {}) {
    let out = '';
    script.forEach((lines, k) => {
      if (k > state.step) return;
      const t = k < state.step ? 1e9 : time;
      for (const line of lines) {
        if (t < line.at) continue;
        if (line.type) {
          const typed = M.typed(line.text, t, line.at, line.cps || 30), typing = typed.length < line.text.length;
          out += `<span class="p">${esc(line.prompt ?? prompt)}</span><span class="k">${esc(typed)}</span>${typing ? '<span class="cursor"></span>' : ''}\n`;
        } else {
          const e = M.enter(t, line.at, .35, 6), hl = line.hl !== undefined && t >= line.hl && (k === state.step || line.keep);
          out += `<span class="${line.cls || ''} ${hl ? 'hl' : ''}" style="${e.style};display:inline-block">${esc(line.text)}</span>\n`;
        }
      }
    });
    return `<div class="sc-center"><div class="mock" data-qa-text="terminal"><div class="mock-bar"><i></i><i></i><i></i><span>${esc(title)}</span><em>${esc(badge)}</em></div><pre>${out}</pre></div></div>`;
  }
  // App/screen mock: a device-like card with a title bar. `body` is HTML built from .app-* classes.
  function app({ title, body, badge = 'simulação', note = '' }) {
    return `<div class="sc-center"><div class="mock-app" data-qa-text="app"><div class="mock-app-bar"><b>${esc(title)}</b><em>${esc(badge)}</em></div><div class="mock-app-body">${body}</div></div>${note ? `<p class="sc-note">${esc(note)}</p>` : ''}</div>`;
  }

  // Practice screen with choice cards. Continuar stays disabled until an answer exists;

        <text x="310" y="260" font-size="14" font-weight="600" fill="var(--accent-ink)" text-anchor="middle" data-qa-text="edge-fetch">FETCH</text>

        <!-- LOADING -> SUCCESS -->
        <path d="M 540 250 L 720 180" stroke="${step >= 2 ? 'var(--good)' : 'var(--line)'}" stroke-width="${step >= 2 ? 4 : 2}" marker-end="url(#arrow)" />
        <text x="630" y="200" font-size="14" font-weight="600" fill="var(--good)" text-anchor="middle" data-qa-text="edge-resolve">RESOLVE</text>

        <!-- LOADING -> ERROR -->
        <path d="M 540 310 L 720 380" stroke="${step >= 2 ? '#d9480f' : 'var(--line)'}" stroke-width="${step >= 2 ? 4 : 2}" marker-end="url(#arrow-warn)" />
        <text x="630" y="365" font-size="14" font-weight="600" fill="#d9480f" text-anchor="middle" data-qa-text="edge-reject">REJECT</text>

        <!-- ERROR -> LOADING (RETRY) -->
        <path d="M 760 420 C 680 500, 480 480, 470 340" fill="none" stroke="${step >= 3 ? 'var(--warm)' : 'var(--line)'}" stroke-width="${step >= 3 ? 4 : 2}" stroke-dasharray="${step >= 3 ? 'none' : '6 4'}" marker-end="url(#arrow)" />
        <text x="600" y="480" font-size="14" font-weight="700" fill="var(--warm)" text-anchor="middle" data-qa-text="edge-retry">RETRY</text>

        <!-- Nós / Estados -->
        <!-- IDLE -->
        <g transform="translate(160, 280)" data-qa-text="node-idle">
          <circle r="55" fill="${n1Active ? 'var(--accent-soft)' : 'var(--surface)'}" stroke="${n1Active ? 'var(--accent)' : 'var(--line)'}" stroke-width="${n1Active ? 4 : 2}" />
          <text text-anchor="middle" dominant-baseline="central" font-size="16" font-weight="700" fill="${n1Active ? 'var(--accent-ink)' : 'var(--ink)'}">IDLE</text>
        </g>

        <!-- LOADING -->
        <g transform="translate(470, 280)" data-qa-text="node-loading">
          <circle r="55" fill="${n2Active ? 'var(--accent-soft)' : 'var(--surface)'}" stroke="${n2Active ? 'var(--accent)' : 'var(--line)'}" stroke-width="${n2Active ? 4 : 2}" />
          <text text-anchor="middle" dominant-baseline="central" font-size="16" font-weight="700" fill="${n2Active ? 'var(--accent-ink)' : 'var(--ink)'}">LOADING</text>
        </g>

        <!-- SUCCESS -->
        <g transform="translate(780, 160)" data-qa-text="node-success">
          <circle r="55" fill="${n3Active ? 'var(--good-soft)' : 'var(--surface)'}" stroke="${n3Active ? 'var(--good)' : 'var(--line)'}" stroke-width="${n3Active ? 4 : 2}" />
          <text text-anchor="middle" dominant-baseline="central" font-size="15" font-weight="700" fill="${n3Active ? 'var(--good)' : 'var(--ink)'}">SUCCESS</text>
        </g>

        <!-- ERROR -->
        <g transform="translate(780, 400)" data-qa-text="node-error">
          <circle r="55" fill="${n4Active ? 'var(--bad-soft)' : 'var(--surface)'}" stroke="${n4Active ? 'var(--bad)' : 'var(--line)'}" stroke-width="${n4Active ? 4 : 2}" />
          <text text-anchor="middle" dominant-baseline="central" font-size="15" font-weight="700" fill="${n4Active ? 'var(--bad)' : 'var(--ink)'}">ERROR</text>
        </g>
      `;

      return {
        html: K.diagram(body, { w: 1000, h: 560 }),
        caption: step === 0 
          ? "Estado inicial IDLE: o sistema aguarda uma intenção do usuário."
          : step === 1
          ? "Ao disparar FETCH, o sistema entra deterministicamente em LOADING."
          : step === 2
          ? "O ciclo bifurca: resolução positiva (SUCCESS) ou tratamento de falha (ERROR)."
          : "O arco de recuperação RETRY reconduz o sistema de volta a LOADING com segurança."
      };
    }
  },

  // TELA 3: EXEMPLO FUNCIONAL INTERATIVO
  {
    id: "mecanismo-funcional",
    kind: "mock",
    kicker: "Simulação Prática",
    title: "Executando a Máquina de Estados",
    initialInputs: { status: "IDLE", lastEvent: "NENHUM" },
    controls: [
      {
        key: "status",
        type: "choice",
        label: "Estado Atual",
        options: [
          { value: "IDLE", label: "1. Repouso (IDLE)" },
          { value: "LOADING", label: "2. Buscando (LOADING)" },
          { value: "SUCCESS", label: "3. Concluído (SUCCESS)" },
          { value: "ERROR", label: "4. Falha (ERROR)" }
        ]
      }
    ],
    steps: [
      { id: "s1", label: "Simulador de transição", duration: 1.0 }
    ],
    sources: [],
    render({ state, time }) {
      const current = state.inputs.status || "IDLE";
      
      const badgeColor = current === "IDLE" ? "var(--muted)" 
        : current === "LOADING" ? "var(--accent)" 
        : current === "SUCCESS" ? "var(--good)" 
        : "var(--bad)";

      const allowedTransitions = {
        IDLE: ["FETCH"],
        LOADING: ["RESOLVE", "REJECT"],
        SUCCESS: ["RESET"],
        ERROR: ["RETRY", "RESET"]
      };

      const allowed = allowedTransitions[current] || [];

      const bodyHtml = `
        <div style="padding:24px; text-align:left;">
          <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:20px; padding-bottom:16px; border-bottom:1px solid var(--line);">
            <div>
              <span style="font-size:12px; font-weight:700; color:var(--muted); text-transform:uppercase;">Estado Ativo</span>
              <div style="font-size:28px; font-weight:800; color:${badgeColor}; font-family:var(--mono);" data-qa-text="current-state" data-value="${current}">
                ${current}
              </div>
            </div>
            <div style="padding:8px 16px; border-radius:99px; background:var(--bg); border:1px solid var(--line); font-size:13px; font-weight:600;">
              Transições válidas agora: ${allowed.join(", ")}
            </div>
          </div>

          <div style="display:grid; grid-template-columns:repeat(auto-fit, minmax(180px, 1fr)); gap:12px; margin-bottom:20px;">
            <div style="padding:14px; border-radius:12px; background:var(--bg); border:1px solid var(--line);">
              <strong style="display:block; font-size:14px; margin-bottom:6px;">Evento FETCH</strong>
              <span style="font-size:12px; color:var(--muted);">Válido em: IDLE</span>
              <div style="margin-top:8px; font-size:12px; font-weight:700; color:${allowed.includes("FETCH") ? "var(--good)" : "var(--bad)"};">
                ${allowed.includes("FETCH") ? "✓ Permitido" : "✗ Bloqueado"}
              </div>
            </div>

            <div style="padding:14px; border-radius:12px; background:var(--bg); border:1px solid var(--line);">
              <strong style="display:block; font-size:14px; margin-bottom:6px;">Evento RESOLVE</strong>
              <span style="font-size:12px; color:var(--muted);">Válido em: LOADING</span>
              <div style="margin-top:8px; font-size:12px; font-weight:700; color:${allowed.includes("RESOLVE") ? "var(--good)" : "var(--bad)"};">
                ${allowed.includes("RESOLVE") ? "✓ Permitido" : "✗ Bloqueado"}
              </div>
            </div>

            <div style="padding:14px; border-radius:12px; background:var(--bg); border:1px solid var(--line);">
              <strong style="display:block; font-size:14px; margin-bottom:6px;">Evento RETRY</strong>
              <span style="font-size:12px; color:var(--muted);">Válido em: ERROR</span>
              <div style="margin-top:8px; font-size:12px; font-weight:700; color:${allowed.includes("RETRY") ? "var(--good)" : "var(--bad)"};">
                ${allowed.includes("RETRY") ? "✓ Permitido" : "✗ Bloqueado"}
              </div>
            </div>
          </div>

          <div style="padding:12px 16px; border-radius:10px; background:var(--accent-soft); color:var(--accent-ink); font-size:14px; font-weight:550;">
            💡 O mecanismo protege a aplicação: cliques duplicados em "Buscar" durante o estado LOADING são rigorosamente ignorados pela máquina.
          </div>
        </div>
      `;

      return {
        html: `
          <div class="sc-center">
            <div class="mock-app" style="width:100%; max-width:780px;">
              <div class="mock-app-bar">
                <b>Painel da Máquina de Estados (Runtime)</b>
                <em>FSM Engine</em>
              </div>
              <div class="mock-app-body" style="padding:0;">
                ${bodyHtml}
              </div>
            </div>
          </div>
        `,
        caption: "Alterne os estados nos controles abaixo para ver como as regras de transição mudam dinamicamente."
      };
    }
  },

  // TELA 4: EXERCÍCIO PRÁTICO COM FEEDBACK CAUSAL
  K.quiz({
    id: "exercicio-fsm",
    kicker: "Verificação Prática",
    title: "Tratamento de Falhas e Transições",
    question: "O sistema está no estado ERROR. O usuário clica em 'Tentar Novamente'. Qual deve ser a transição implementada na máquina de estados?",
    hint: "Pense na integridade dos dados e na necessidade de realizar um novo processamento assíncrono.",
    options: [
      {
        value: "direto-sucesso",
        label: "A) Transicionar diretamente de ERROR para SUCCESS"
      },
      {
        value: "correto-retry",
        label: "B) Disparar RETRY e transicionar de ERROR para LOADING"
      },
      {
        value: "sopa-booleana",
        label: "C) Manter isError: true e ligar isLoading: true simultaneamente"
      }
    ],
    correct: "correto-retry",
    feedback: {
      "direto-sucesso": "Incorreto: Ir para SUCCESS antes de receber novos dados do servidor mascara o erro anterior e corrompe a interface com informações desatualizadas.",
      "correto-retry": "Correto! O evento RETRY devolve a máquina ao estado LOADING. Isso reinicia o pipeline assíncrono com segurança e garante que a interface renderize o spinner enquanto aguarda a nova resposta.",
      "sopa-booleana": "Incorreto: Essa combinação recria exatamente a sopa booleana, colocando o sistema em um estado contraditório e impossível."
    },
    sources: [],
    lang: "pt-BR"
  }),

  // TELA 5: SÍNTESE E APLICAÇÃO NO CÓDIGO
  {
    id: "sintese-final",
    kind: "resumo",
    kicker: "Conclusão",
    title: "Três Princípios para o seu Código",
    steps: [
      { id: "cards", label: "Princípios Fundamentais", duration: 1.0 }
    ],
    sources: [],
    render({ state, time }) {
      const items = [
        {
          icon: "🛡️",
          text: "Torne estados impossíveis irrepresentáveis",
          sub: "Use uniões discriminadas no TypeScript ou Enums. Se o estado não existe no tipo, ele não pode acontecer em produção."
        },
        {
          icon: "⚡",
          text: "Transições declarativas e puras",
          sub: "Modele o comportamento como um reducer puro: (estadoAtual, evento) => proximoEstado. Sem mutações mágicas."
        },
        {
          icon: "🎯",
          text: "Determinismo absoluto",
          sub: "A mesma sequência de eventos sempre produz o mesmo resultado. Torna testes unitários simples e reproduzíveis."
        }
      ];

      return {
        html: K.cards(items, time),
        caption: "Parabéns! Você concluiu a aula sobre Máquinas de Estados em Programação."
      };
    }
  }
];
