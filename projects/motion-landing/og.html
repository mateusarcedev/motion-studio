<!doctype html><html><head><meta charset="utf-8"><style>
@font-face{font-family:"Geist";src:url("site/fonts/Geist.woff");font-weight:100 900}
@font-face{font-family:"Geist Mono";src:url("site/fonts/GeistMono.woff");font-weight:100 900}
*{margin:0;padding:0;box-sizing:border-box}
body{width:1200px;height:630px;background:#0e0e0e;color:#f4f4f4;font-family:"Geist Mono",monospace;position:relative;overflow:hidden}
.brand{position:absolute;left:72px;top:60px;display:flex;align-items:center;gap:12px;font-size:22px}
.brand i{width:12px;height:12px;border-radius:50%;background:#15F5BA}
.brand b{font-weight:600}.brand span{color:#909090}
h1{position:absolute;left:72px;top:190px;width:640px;font:600 92px/0.98 "Geist";letter-spacing:-.045em}
h1 em{font-style:normal;color:#15F5BA}
.tag{position:absolute;left:72px;bottom:60px;font-size:20px;color:#a8a8a8;letter-spacing:.02em}
.tag b{color:#15F5BA;font-weight:500}
.win{position:absolute;right:72px;top:70px;width:360px;height:490px;border:1px solid #232323;border-radius:16px;background:#1a1a1a;overflow:hidden}
.top{height:38px;background:#222;border-bottom:1px solid #1c1c1c;display:flex;align-items:center;gap:7px;padding:0 14px}
.top span{width:8px;height:8px;border-radius:50%;background:#909090}.top span:nth-child(2){background:#E96479}.top span:nth-child(3){background:#15F5BA}
.win img{position:absolute;left:50%;top:56px;transform:translateX(-50%);height:340px;border-radius:10px;border:1px solid #232323}
.tl{position:absolute;left:16px;right:16px;bottom:16px;display:flex;flex-direction:column;gap:6px}
.tl div{height:22px;border-radius:4px;background:#151515;position:relative}
.tl div i{position:absolute;top:2px;bottom:2px;border-radius:3px;background:#15F5BA}
</style></head><body>

<div class="tl"><div><i style="left:0;width:12%"></i><i style="left:12.5%;width:20%;opacity:.7"></i><i style="left:33%;width:16%"></i><i style="left:49.5%;width:9%;opacity:.7"></i><i style="left:59%;width:9%"></i><i style="left:68.5%;width:9%;opacity:.7"></i><i style="left:78%;width:19%"></i></div><div><i style="left:0;width:12%;background:#E96479"></i><i style="left:95.5%;width:4.5%;background:#E96479"></i></div></div></div>
</body></html>
