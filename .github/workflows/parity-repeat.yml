name: Paridade CLI×MCP (repetição)

on:
  workflow_dispatch:
    inputs:
      repeat:
        description: Quantas vezes rodar mcp_parity
        default: "10"
      node:
        description: Versão principal do Node para reproduzir a paridade
        type: choice
        options: ["20", "22", "24"]
        default: "24"

permissions:
  contents: read

jobs:
  parity:
    name: mcp_parity repetido (Node ${{ inputs.node || '24' }})
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { fetch-depth: 1, persist-credentials: false }
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: "${{ inputs.node || '24' }}", cache: npm }
      - name: CPU do runner
        run: |
          lscpu | tee cpu.txt
          { echo "### CPU do runner"; echo '```'; grep -E "Model name|^CPU\(s\)|Vendor" cpu.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - name: FFmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends ffmpeg fonts-dejavu-core && ffmpeg -version | head -1
      - run: npm ci --no-audit --no-fund
      - name: Chromium
        run: npx playwright-core install --with-deps chromium
      - name: mcp_parity em repetição
        env:
          REPEAT: ${{ inputs.repeat || '10' }}
          MOTION_MCP_PARITY_CAPTURE_FFMPEG: "1"
          MOTION_TEST_CONCURRENCY: "1"
        shell: bash
        run: |
          # every round runs, even after a failure; any failure fails the job
          [[ "$REPEAT" =~ ^[1-9][0-9]*$ ]] || { echo "repeat inválido"; exit 2; }
          bad=0
          for ((i = 1; i <= REPEAT; i++)); do
            echo "=== rodada $i/$REPEAT"
            if node --test tests/mcp_parity.test.mjs; then
              status=0
            else
              status=$?
              bad=$((bad + 1))
              echo "=== rodada $i FALHOU"
              if [ -d tests/tmp/mcp-parity ]; then cp -a tests/tmp/mcp-parity "tests/tmp/mcp-parity-failure-$i"; fi
            fi
            if [ -d tests/tmp/mcp-parity ]; then cp -a tests/tmp/mcp-parity "tests/tmp/mcp-parity-round-$i"; fi
            if [ "$status" -ne 0 ]; then echo "=== rodada $i exit $status"; fi
          done
          echo "RESULTADO: $bad falhas em $REPEAT rodadas" | tee -a "$GITHUB_STEP_SUMMARY"
          [ "$bad" -eq 0 ]
      - name: Diagnósticos compactos de todas as rodadas
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: "mcp-parity-repeat-node${{ inputs.node || '24' }}-diagnostics"
          path: |
            tests/tmp/mcp-parity-round-*/environment.json
            tests/tmp/mcp-parity-round-*/ffmpeg-commands.log
            tests/tmp/mcp-parity-round-*/parity-report.json
          retention-days: 30
          if-no-files-found: warn
      - name: Artefatos de falhas da paridade
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: "mcp-parity-repeat-node${{ inputs.node || '24' }}"
          path: tests/tmp/mcp-parity-failure-*
          retention-days: 30
          if-no-files-found: warn
